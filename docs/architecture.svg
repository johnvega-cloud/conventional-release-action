<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- Terraform -->
  <rect x="20" y="40" width="190" height="130" rx="8" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="115" y="64" text-anchor="middle" font-weight="bold" fill="#581c87">Terraform (terraform/)</text>
  <text x="34" y="90" fill="#1e293b">variables.tf</text>
  <text x="34" y="110" fill="#475569">tag_prefix, initial_version,</text>
  <text x="34" y="128" fill="#475569">owner, repository name...</text>
  <text x="34" y="154" fill="#475569">token: GITHUB_TOKEN env</text>

  <!-- GitHub repository -->
  <rect x="270" y="20" width="570" height="360" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="555" y="44" text-anchor="middle" font-weight="bold" fill="#0f172a">GitHub repository (created by Terraform)</text>

  <rect x="290" y="62" width="200" height="56" rx="6" fill="#ffffff" stroke="#7e22ce"/>
  <text x="390" y="84" text-anchor="middle" font-weight="bold" fill="#1e293b">Actions variables</text>
  <text x="390" y="104" text-anchor="middle" fill="#475569">TAG_PREFIX, INITIAL_VERSION</text>

  <rect x="290" y="300" width="200" height="56" rx="6" fill="#ffffff" stroke="#7e22ce"/>
  <text x="390" y="322" text-anchor="middle" font-weight="bold" fill="#1e293b">Tag ruleset</text>
  <text x="390" y="342" text-anchor="middle" fill="#475569">no update, no delete</text>

  <rect x="290" y="170" width="200" height="76" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="390" y="194" text-anchor="middle" font-weight="bold" fill="#1e293b">release.yml</text>
  <text x="390" y="214" text-anchor="middle" fill="#475569">push to default branch</text>
  <text x="390" y="232" text-anchor="middle" fill="#475569">checkout, full history</text>

  <rect x="550" y="150" width="270" height="116" rx="6" fill="#ecfdf5" stroke="#047857"/>
  <text x="685" y="172" text-anchor="middle" font-weight="bold" fill="#064e3b">Composite action (action.yml + release.sh)</text>
  <text x="564" y="196" fill="#1e293b">1. last tag + commits since it</text>
  <text x="564" y="214" fill="#1e293b">2. fix / feat / breaking → next version</text>
  <text x="564" y="232" fill="#1e293b">3. changelog</text>
  <text x="564" y="250" fill="#1e293b">4. annotated tag, push</text>

  <rect x="550" y="300" width="270" height="56" rx="6" fill="#ffffff" stroke="#334155"/>
  <text x="685" y="322" text-anchor="middle" font-weight="bold" fill="#1e293b">Tag v1.5.0 + GitHub Release</text>
  <text x="685" y="342" text-anchor="middle" fill="#475569">changelog as tag message and notes</text>

  <!-- Arrows -->
  <path d="M210 90H288" stroke="#475569" fill="none" marker-end="url(#arrow)"/>
  <path d="M115 170V328H288" stroke="#475569" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 118V168" stroke="#475569" fill="none" marker-end="url(#arrow)"/>
  <text x="398" y="148" fill="#475569">vars.*</text>
  <path d="M490 208H548" stroke="#475569" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="200" fill="#475569">inputs</text>
  <path d="M685 266V298" stroke="#475569" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 328H548" stroke="#475569" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="496" y="320" fill="#475569">protects</text>
</svg>
