name: release

# Example of how to use the action: this repository releases itself with it.
on:
  push:

permissions:
  contents: read

# One release at a time, so two merges cannot compute the same version.
concurrency: release

jobs:
  release:
    # Only the default branch releases. The name is not written here: GitHub provides it.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags: the action reads both

      - id: release
        uses: ./ # in another repository: uses: OWNER/REPOSITORY@TAG
        with:
          # Both values are repository variables created by terraform/.
          tag-prefix: ${{ vars.TAG_PREFIX }}
          initial-version: ${{ vars.INITIAL_VERSION }}

      - name: Create the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.changelog-file }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
